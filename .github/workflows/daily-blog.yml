name: Publish Technical Article

on:
  schedule:
    # 14:00 UTC = 21:00 WIB (UTC+7) setiap hari
    - cron: '0 14 * * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tombol GitHub Actions

permissions:
  contents: write

jobs:
  publish-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Publish Laravel Article & Build
        run: node scripts/generate-laravel-blog.mjs

      - name: Commit and Push New Article
        run: |
          git config --global user.name "Risyal Febrianto"
          git config --global user.email "risyalfebrianto97@gmail.com"
          git add src/content/blog/
          # Commit hanya jika ada artikel baru yang dipublikasikan
          git diff --staged --quiet || git commit -m "feat(blog): publish new technical article [skip ci]"
          git push origin main

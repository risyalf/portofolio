name: Daily Laravel Blog Automation

on:
  schedule:
    # 14:00 UTC = 21:00 WIB (UTC+7) setiap hari
    - cron: '0 14 * * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tombol GitHub Actions

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Daily Laravel Article & Build
        run: node scripts/generate-laravel-blog.mjs

      - name: Commit and Push New Article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          # Commit hanya jika ada artikel baru yang dibuat
          git diff --staged --quiet || git commit -m "chore(blog): auto-generate daily Laravel article [skip ci]"
          git push origin main
